name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  tauri-windows:
    name: tauri bundle (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run tauri:build
      - name: Verify Windows installers
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -Include *.msi,*.exe
          if (-not $files) { throw "No Windows installers were produced" }
          $files | ForEach-Object { "{0} ({1:N1} MB)" -f $_.FullName, ($_.Length / 1MB) }
      - name: Install and launch app
        shell: pwsh
        timeout-minutes: 5
        run: |
          $setup = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $setup) { throw "No NSIS installer was produced" }

          $installer = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer exited with code $($installer.ExitCode)" }

          $candidates = @(
            (Join-Path $env:LOCALAPPDATA "Gitastic\gitastic.exe"),
            (Join-Path $env:PROGRAMFILES "Gitastic\gitastic.exe"),
            (Join-Path ${env:ProgramFiles(x86)} "Gitastic\gitastic.exe")
          )
          $app = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $app) { throw "Installed gitastic.exe was not found" }

          $version = (Get-Item $app).VersionInfo.ProductVersion
          "Installed $app ($version)"

          $running = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 10
          if ($running.HasExited) { throw "Gitastic exited during startup with code $($running.ExitCode)" }
          "Gitastic still running after 10 seconds"
          Stop-Process -Id $running.Id -Force
      - uses: actions/upload-artifact@v7
        with:
          name: gitastic-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  tauri-macos:
    name: tauri bundle (macos)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: rustup target add x86_64-apple-darwin
      - run: npm run tauri:build -- --target universal-apple-darwin
      - name: Verify macOS bundles
        run: |
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          test -d "$bundle/macos/Gitastic.app"
          test -n "$(ls -1 "$bundle"/dmg/*.dmg 2>/dev/null)"
          ls -lh "$bundle/macos"
          ls -lh "$bundle/dmg"
      - name: Package macOS app
        run: |
          cd src-tauri/target/universal-apple-darwin/release/bundle/macos
          ditto -c -k --sequesterRsrc --keepParent Gitastic.app Gitastic.app.zip
      - uses: actions/upload-artifact@v7
        with:
          name: gitastic-macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/Gitastic.app.zip
          if-no-files-found: error
          retention-days: 14

  tauri-linux:
    name: tauri bundle (linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run tauri:build
      - name: Verify Linux bundles
        run: |
          bundle=src-tauri/target/release/bundle
          test -n "$(ls -1 "$bundle"/deb/*.deb 2>/dev/null)"
          test -n "$(ls -1 "$bundle"/rpm/*.rpm 2>/dev/null)"
          test -n "$(ls -1 "$bundle"/appimage/*.AppImage 2>/dev/null)"
          ls -lh "$bundle/deb" "$bundle/rpm" "$bundle/appimage"
      - uses: actions/upload-artifact@v7
        with:
          name: gitastic-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
